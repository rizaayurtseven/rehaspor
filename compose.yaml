name: rehaspor-local

services:
  database:
    image: postgres:18.4-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: rehaspor
      POSTGRES_USER: rehaspor
      POSTGRES_PASSWORD: rehaspor
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehaspor -d rehaspor"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - rehaspor_postgres_data:/var/lib/postgresql

volumes:
  rehaspor_postgres_data:
